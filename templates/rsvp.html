<!-- DATA CONTAINERS: Plain text prevents VS Code from running JS or JSON linters -->
    <script id="rsvps-data" type="text/plain">{{ rsvps | tojson | safe }}</script>
    <script id="players-data" type="text/plain">{{ players | tojson | safe }}</script>

    <script>
        const rsvps = JSON.parse(document.getElementById('rsvps-data').textContent);
        const players = JSON.parse(document.getElementById('players-data').textContent);

        function setStorage(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function getStorage(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function removeStorage(k) { try { localStorage.removeItem(k); } catch (e) {} }

        function renderRosterDashboard() {
            const inList = document.getElementById('in-players-list');
            const outList = document.getElementById('out-players-list');
            const pendingList = document.getElementById('pending-players-list');
            const feedList = document.getElementById('feed-list');
            const feedBox = document.getElementById('milestone-feed-box');
            
            inList.innerHTML = '';
            outList.innerHTML = '';
            pendingList.innerHTML = '';
            feedList.innerHTML = '';

            let inCount = 0;
            let outCount = 0;
            let pendingCount = 0;
            let feedItems = [];

            players.forEach(p => {
                const status = rsvps[p.id];
                
                let tagBadges = '';
                if (p.win_streak >= 2) tagBadges += ' 🔥';
                else if (p.attn_streak >= 3) tagBadges += ' ⚡';
                if (p.win_pct !== null && p.win_pct >= 70) tagBadges += ' 👑';
                if (p.attn_pct !== null && p.attn_pct >= 75) tagBadges += ' 🛡️';
                if (p.mvp_count > 0) tagBadges += ' ⭐';

                if (p.win_streak >= 2) {
                    feedItems.push(`🔥 <strong>${p.name}</strong> has won ${p.win_streak} games on the bounce!`);
                } else if (p.attn_streak >= 3) {
                    feedItems.push(`⚡ <strong>${p.name}</strong> has played ${p.attn_streak} weeks in a row!`);
                }

                if (p.win_pct !== null && p.win_pct >= 70) {
                    feedItems.push(`👑 <strong>${p.name}</strong> has an elite ${p.win_pct}% win rate (${p.appearances} games played).`);
                }
                if (p.attn_pct !== null && p.attn_pct >= 75) {
                    feedItems.push(`🛡️ <strong>${p.name}</strong> is a core die-hard (${p.attn_pct}% attendance across ${p.appearances} games).`);
                }

                const tagHtml = `<span class="tag ${status === 'IN' ? 'tag-in' : status === 'OUT' ? 'tag-out' : 'tag-pending'}" onclick="showPlayerStatsModal('${p.id}')">${p.name}${tagBadges}</span>`;

                if (status === 'IN') {
                    inCount++;
                    inList.innerHTML += tagHtml;
                } else if (status === 'OUT') {
                    outCount++;
                    outList.innerHTML += tagHtml;
                } else {
                    pendingCount++;
                    pendingList.innerHTML += tagHtml;
                }
            });

            if (feedItems.length > 0) {
                feedBox.style.display = 'block';
                feedItems.forEach(item => {
                    feedList.innerHTML += `<li class="feed-item">${item}</li>`;
                });
            } else {
                feedBox.style.display = 'none';
            }

            document.getElementById('in-count-badge').innerText = `${inCount} / 10`;
            document.getElementById('out-count').innerText = outCount;
            document.getElementById('pending-count').innerText = pendingCount;

            const ringerBox = document.getElementById('ringer-needed-box');
            if (inCount < 10) {
                const needed = 10 - inCount;
                ringerBox.innerHTML = `<div class="ringer-alert">🚨 Need <strong>${needed} more player${needed > 1 ? 's' : ''}</strong> for 5-a-side!</div>`;
            } else if (inCount === 10) {
                ringerBox.innerHTML = `<div class="ringer-alert" style="background:#d4edda; color:#155724;">✅ Full 5-a-side squad reached (10 players)!</div>`;
            } else if (inCount > 10 && inCount <= 12) {
                ringerBox.innerHTML = `<div class="ringer-alert" style="background:#d4edda; color:#155724;">✅ Squad at ${inCount} players (subs included, cap is 12).</div>`;
            }
        }

        function showPlayerStatsModal(playerId) {
            const p = players.find(player => player.id === playerId);
            if (!p) return;

            let details = [];
            if (p.win_streak >= 2) details.push(`🔥 <strong>Winning Streak:</strong> ${p.win_streak} games on the bounce`);
            if (p.attn_streak >= 3) details.push(`⚡ <strong>Attendance Streak:</strong> ${p.attn_streak} weeks in a row`);
            if (p.win_pct !== null && p.win_pct >= 70) details.push(`👑 <strong>Elite Win Rate:</strong> ${p.win_pct}% (${p.appearances} games)`);
            if (p.attn_pct !== null && p.attn_pct >= 75) details.push(`🛡️ <strong>Die-hard Attendance:</strong> ${p.attn_pct}% (${p.appearances} games)`);
            if (p.mvp_count > 0) details.push(`⭐ <strong>Star Player Awards:</strong> ${p.mvp_count}x Match MVP`);

            let bodyHtml = '';
            if (details.length > 0) {
                bodyHtml = '<ul style="text-align: left; padding-left: 15px; margin: 10px 0; font-size: 0.9rem;">' +
                    details.map(d => `<li style="margin: 8px 0;">${d}</li>`).join('') +
                    '</ul>';
            } else {
                bodyHtml = `<p style="color: #6c757d; margin: 15px 0; font-size: 0.9rem;">No active streaks or badges currently.<br><small>Total matches played: <strong>${p.appearances || 0}</strong></small></p>`;
            }

            document.getElementById('modal-player-name').innerText = p.name;
            document.getElementById('modal-stats-body').innerHTML = bodyHtml;
            document.getElementById('stats-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('stats-modal').style.display = 'none';
        }

        function closeModalOnBg(e) {
            if (e.target.id === 'stats-modal') closeModal();
        }

        function init() {
            renderRosterDashboard();

            const urlParams = new URLSearchParams(window.location.search);
            const newId = urlParams.get('new_id');
            const newName = urlParams.get('new_name');

            if (newId && newName) {
                setStorage('5aside_player_id', newId);
                setStorage('5aside_player_name', newName);
                window.history.replaceState({}, document.title, window.location.pathname);
                showRsvpScreen(newId, newName);
                return;
            }

            const savedId = getStorage('5aside_player_id');
            const savedName = getStorage('5aside_player_name');
            const playerExists = players && players.some(p => p.id === savedId);

            if (savedId && savedName && playerExists) {
                showRsvpScreen(savedId, savedName);
            } else if (savedId && !playerExists) {
                clearSavedPlayer();
            }
        }

        function handlePlayerClick(btn) {
            const id = btn.getAttribute('data-id');
            const name = btn.getAttribute('data-name');
            setStorage('5aside_player_id', id);
            setStorage('5aside_player_name', name);
            showRsvpScreen(id, name);
        }

        function showRsvpScreen(id, name) {
            document.getElementById('select-step').style.display = 'none';
            document.getElementById('new-player-step').style.display = 'none';
            document.getElementById('rsvp-step').style.display = 'block';
            document.getElementById('welcome-msg').innerText = `Hey ${name}!`;
            document.getElementById('form-player-id').value = id;

            const playerObj = players.find(p => p.id === id);
            const streakBox = document.getElementById('personal-streak-box');
            
            if (playerObj) {
                if (playerObj.win_streak >= 2) {
                    streakBox.innerHTML = `<div class="streak-banner">🔥 Hot streak! You're on a <strong>${playerObj.win_streak} game winning streak</strong>!</div>`;
                } else if (playerObj.attn_streak >= 3) {
                    streakBox.innerHTML = `<div class="streak-banner">⚡ Great loyalty! You've played <strong>${playerObj.attn_streak} weeks in a row</strong>!</div>`;
                } else {
                    streakBox.innerHTML = '';
                }
            }

            const currentStatus = rsvps[id];
            const statusBox = document.getElementById('current-status-box');
            
            if (currentStatus) {
                statusBox.innerHTML = `<div class="status-badge status-${currentStatus}">Current Status: You're ${currentStatus}</div>`;
            } else {
                statusBox.innerHTML = `<p style="color:#6c757d;">You haven't responded yet for this week.</p>`;
            }
        }

        function showNewPlayerForm() {
            document.getElementById('select-step').style.display = 'none';
            document.getElementById('new-player-step').style.display = 'block';
        }

        function hideNewPlayerForm() {
            document.getElementById('new-player-step').style.display = 'none';
            document.getElementById('select-step').style.display = 'block';
        }

        function submitVote(status) {
            document.getElementById('form-status').value = status;
            document.getElementById('rsvp-form').submit();
        }

        function clearSavedPlayer() {
            removeStorage('5aside_player_id');
            removeStorage('5aside_player_name');
            document.getElementById('rsvp-step').style.display = 'none';
            document.getElementById('new-player-step').style.display = 'none';
            document.getElementById('select-step').style.display = 'block';
        }

        init();
    </script>
