<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access - Monday Night 5-a-Side</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 360px; margin: 80px auto; padding: 0 20px; line-height: 1.5; background: #f8f9fa; color: #212529; text-align: center; }
        .card { background: white; padding: 30px 25px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        input[type="password"] { width: 100%; padding: 12px; font-size: 1.4rem; text-align: center; letter-spacing: 6px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; color: white; background: #0066cc; }
        .btn:hover { background: #0052a3; }
        .error-msg { background: #f8d7da; color: #721c24; padding: 8px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 15px; }
        .back-link { display: inline-block; margin-top: 20px; font-size: 0.9rem; color: #6c757d; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 2.2rem; margin-bottom: 8px;">🔒</div>
        <h2 style="margin: 0 0 8px 0;">Admin Access</h2>
        <p style="color: #6c757d; font-size: 0.9rem; margin-bottom: 20px;">Enter organizer PIN to unlock dashboard</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="next" value="{{ next_url }}">
            <input type="password" name="pin" pattern="[0-9]*" inputmode="numeric" maxlength="8" placeholder="••••" required autofocus>
            <button type="submit" class="btn">Unlock Dashboard ⚡</button>
        </form>

        <a href="/rsvp" class="back-link">&larr; Return to Public RSVP</a>
    </div>
</body>
</html>
